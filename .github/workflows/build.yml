name: Build Test Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-client:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build test client
      shell: pwsh
      run: |
        msbuild TestClient.vcxproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }}

    - name: Upload test client artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestClient-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/TestClient.exe
        if-no-files-found: error
