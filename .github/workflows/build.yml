name: Build il2cpp-dumper-rs

# لینک پروژه‌ای که بیلد می‌شود:
# https://github.com/rodroidmods/il2cpp-dumper-rs
env:
  SOURCE_REPO: rodroidmods/il2cpp-dumper-rs
  SOURCE_REF: master

on:
  workflow_dispatch:        # اجرای دستی از تب Actions
  push:
    branches: [ main, master ]

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: il2cpp_dumper
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: il2cpp_dumper.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: il2cpp_dumper
          - os: macos-13
            target: x86_64-apple-darwin
            bin: il2cpp_dumper

    steps:
      - name: Checkout source project
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}

      - name: Install Rust toolchain (edition 2024 → stable ≥ 1.85)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: il2cpp_dumper-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
