name: Build Zydis DLL (x64-windows)

# دستی از تب Actions اجرا میشه، و روی هر push به شاخه main هم اجرا میشه
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-zydis:
    runs-on: windows-latest

    steps:
      # 1) کلون کردن مخزن vcpkg
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git

      # کش کردن باینری‌های vcpkg تا دفعات بعد سریع‌تر بیلد بشه
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
            vcpkg/packages
            vcpkg/downloads
          key: vcpkg-zydis-x64-windows-${{ runner.os }}

      # 2 و 3) اجرای اسکریپت bootstrap برای آماده‌سازی vcpkg
      - name: Bootstrap vcpkg
        working-directory: vcpkg
        run: .\bootstrap-vcpkg.bat

      # 4) نصب/بیلد کردن Zydis به صورت DLL برای x64 ویندوز
      - name: Install Zydis (x64-windows DLL)
        working-directory: vcpkg
        run: .\vcpkg.exe install zydis:x64-windows

      # جمع‌آوری خروجی‌ها (DLL، LIB و فایل‌های هدر) در یک پوشه
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output/bin, output/lib, output/include | Out-Null
          $base = "vcpkg/installed/x64-windows"
          Copy-Item "$base/bin/*.dll"      output/bin  -Force -ErrorAction SilentlyContinue
          Copy-Item "$base/bin/*.pdb"      output/bin  -Force -ErrorAction SilentlyContinue
          Copy-Item "$base/lib/*.lib"      output/lib  -Force -ErrorAction SilentlyContinue
          Copy-Item "$base/include/*"      output/include -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "----- محتوای bin -----"
          Get-ChildItem output/bin

      # تحویل خروجی به صورت artifact قابل دانلود
      - name: Upload Zydis DLL
        uses: actions/upload-artifact@v4
        with:
          name: zydis-x64-windows
          path: output
          if-no-files-found: error
