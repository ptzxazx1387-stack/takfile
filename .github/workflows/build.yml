name: Build Driver and Test Client

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: List project files (debug)
      shell: pwsh
      run: |
        Write-Host "Files in workspace root:"
        Get-ChildItem -Name *.vcxproj, *.sln

    - name: Build kernel driver (NullkD.sys)
      shell: pwsh
      run: |
        msbuild NullkD.vcxproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }} `
          /p:SignMode=Off

    - name: Build test client (TestClient.exe)
      shell: pwsh
      run: |
        msbuild TestClient.sln `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=${{ matrix.platform }}

    - name: Upload driver artifact
      uses: actions/upload-artifact@v4
      with:
        name: NullkD-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/NullkD.sys
        if-no-files-found: error

    - name: Upload test client artifact
      uses: actions/upload-artifact@v4
      with:
        name: TestClient-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          **/TestClient.exe
        if-no-files-found: error
