name: Build kdmapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Clone kdmapper
      run: git clone https://github.com/TheCruZ/kdmapper.git
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build kdmapper
      run: |
        cd kdmapper
        msbuild kdmapper.sln /p:Configuration=Release /p:Platform=x64

    - name: Show build output
      shell: powershell
      run: |
        Get-ChildItem -Path kdmapper -Recurse -Filter *.exe | Select-Object FullName
        Get-ChildItem -Path kdmapper -Recurse -Filter *.sys | Select-Object FullName

    - name: Upload whatever we got
      uses: actions/upload-artifact@v4
      with:
        name: kdmapper-files
        path: |
          kdmapper\**\*.exe
          kdmapper\**\*.sys
        if-no-files-found: warn
