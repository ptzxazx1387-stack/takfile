name: Build kdmapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Clone kdmapper
      run: git clone https://github.com/TheCruZ/kdmapper.git
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build kdmapper
      run: |
        cd kdmapper
        msbuild kdmapper.sln /p:Configuration=Release /p:Platform=x64
    
    - name: List output
      shell: cmd
      run: |
        dir /s kdmapper\*.exe

    - name: Upload kdmapper
      uses: actions/upload-artifact@v4
      with:
        name: kdmapper
        path: kdmapper\**\kdmapper.exe
        if-no-files-found: error
