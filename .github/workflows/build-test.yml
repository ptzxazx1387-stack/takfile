name: Build DLL Proxy Generator from Original Repo

on:
  workflow_dispatch: # اجرای دستی
  # push: # در صورت نیاز می‌توانید آن را فعال کنید
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: ۱. دریافت کد پروژه از ریپازیتوری اصلی
      uses: actions/checkout@v4
      with:
        # آدرس ریپازیتوری اصلی را مشخص می‌کنیم
        repository: maluramichael/dll-proxy-generator
        # شاخه‌ای که می‌خواهید بیلد شود (معمولاً main)
        ref: main
        # مسیری که کدها در آن ذخیره می‌شوند (پیش‌فرض: پوشه‌ی کار)
        path: dll-proxy-generator-src

    - name: ۲. راه‌اندازی محیط ویژوال استودیو (شامل MSBuild)
      uses: microsoft/setup-msbuild@v2

    - name: ۳. بیلد کردن پروژه با MSBuild
      working-directory: dll-proxy-generator-src
      run: msbuild /m /p:Configuration=Release DllProxyGenerator.sln

    - name: ۴. نمایش فایل‌های ساخته شده (برای عیب‌یابی)
      run: |
        echo "محتوای پوشه‌ی خروجی:"
        dir dll-proxy-generator-src\DllProxyGenerator\bin\Release\

    - name: ۵. ذخیره‌ی فایل اجرایی به عنوان آرتیفکت
      uses: actions/upload-artifact@v4
      with:
        name: DllProxyGenerator-Executable
        path: dll-proxy-generator-src\DllProxyGenerator\bin\Release\DllProxyGenerator.exe
