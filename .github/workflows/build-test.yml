name: Build Usermode Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile test_driver.exe
      shell: cmd
      run: |
        :: Locate Visual Studio installation
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
        cl /EHsc /std:c++17 test_driver.cpp /Fe:test_driver.exe /link psapi.lib

    - name: Upload test executable
      uses: actions/upload-artifact@v4
      with:
        name: test_driver
        path: test_driver.exe
