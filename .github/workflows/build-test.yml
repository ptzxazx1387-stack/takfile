name: Build DLL Proxy Generator from Original Repo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: ۱. دریافت کد پروژه از ریپازیتوری اصلی
      uses: actions/checkout@v4
      with:
        repository: maluramichael/dll-proxy-generator
        # ★★★ شاخه‌ی صحیح را مشخص کنید ★★★
        ref: master  # به جای main از master استفاده شده است
        path: dll-proxy-generator-src
        # برای کاهش خطا، عمق fetch را افزایش دهید (اختیاری)
        fetch-depth: 1

    - name: ۲. راه‌اندازی محیط ویژوال استودیو
      uses: microsoft/setup-msbuild@v2

    - name: ۳. بیلد کردن پروژه با MSBuild
      working-directory: dll-proxy-generator-src
      # اگر مسیر فایل solution دقیق نیست، می‌توانید از جستجو استفاده کنید
      run: |
        $slnFile = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if ($slnFile) {
          Write-Host "یافتن فایل Solution: $($slnFile.FullName)"
          msbuild /m /p:Configuration=Release "$($slnFile.FullName)"
        } else {
          Write-Host "خطا: هیچ فایل .sln یافت نشد!"
          exit 1
        }

    - name: ۴. ذخیره‌ی فایل اجرایی به عنوان آرتیفکت
      uses: actions/upload-artifact@v4
      with:
        name: DllProxyGenerator-Executable
        # مسیر دقیق‌تر برای اطمینان از پیدا کردن فایل exe
        path: dll-proxy-generator-src\DllProxyGenerator\bin\Release\*.exe
