name: Build Usermode Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile test driver (test_driver.exe)
      shell: cmd
      run: |
        cl /EHsc /std:c++17 test_driver.cpp /Fe:test_driver.exe

    - name: Upload test executable
      uses: actions/upload-artifact@v4
      with:
        name: test_driver
        path: test_driver.exe
